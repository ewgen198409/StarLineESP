; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip

; Готового "esp32-c3-supermini" в реестре плат нет — используем generic
; ESP32-C3-DevKitM-1, распиновка/периферия у Super Mini совместима.
board = esp32-c3-devkitm-1

framework = arduino

monitor_speed = 115200

upload_speed = 921600

; У Super Mini нет USB-UART моста (CH340/CP2102) - модуль подключается
; напрямую нативным USB чипа (GPIO18/19). Поэтому Serial ОБЯЗАТЕЛЬНО нужно
; перевести на USB-CDC, иначе монитор порта будет пустым, а вывод в
; DEBUG-режиме никто не увидит.
; ARDUINO_USB_MODE=1        - используем встроенный USB-контроллер (не JTAG)
; ARDUINO_USB_CDC_ON_BOOT=1 - Serial поднимается как USB CDC сразу при старте
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
    -Wno-deprecated-declarations
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Большинство плат ESP32-C3 Super Mini несут 4 МБ флеша.
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
board_build.flash_mode = dio
board_build.flash_freq = 80m

board_build.partitions = partitions.csv

board_build.sdkconfig.extra =
    CONFIG_ESP_COREDUMP_ENABLE=n
    CONFIG_ESP32_ENABLE_COREDUMP_TO_FLASH=n

lib_deps =
    OneWire
    DallasTemperature

